[cuda]
packages = [
  "nvdiffrast",
  "pytorch3d",
  "torch_scatter",
  "torch_cluster",
  "spconv",
  "cumm",
  "flash_attn",
  "sageattention",
  "diff_gaussian_rasterization",
  "simple_knn",
  "diso",
  "pointnet2_ops",
  "vox2seq",
  "custom_rasterizer_hy3d2"
]

[dependencies]
# Conda-side: compilers for the handful of runtime-JIT extensions that remain
# (Hunyuan3D_V1's rendering_neus ops, StableFast3D's slang kernels).
c-compiler = "*"
cxx-compiler = "*"

[pypi-dependencies]
comfy-kitchen = "*"
comfy-aimdo = "*"

# spconv's runtime codegen dependency. spconv and cumm come from [cuda] above as
# CUDA-matched wheels, but neither pulls pccm in, so `import spconv.pytorch`
# raises ModuleNotFoundError: pccm -- which surfaces far away, as a Stable3DGen
# node failing to build its Trellis pipeline. ComfyUI-UniRig declares it the
# same way alongside the same spconv/cumm wheels.
pccm = "*"

# scikit-learn: imported as `sklearn` by vendored clustering/segmentation
# code. Nothing else pulls it in, so the failure is a ModuleNotFoundError
# mid-workflow rather than at install time.
scikit-learn = "*"

# xformers deliberately absent. It caps flash-attn at <=2.8.2
# (xformers/ops/fmha/flash.py) and raises ImportError above that, while the
# cuda-wheels farm builds flash_attn 2.8.3. diffusers imports xformers, and 94
# files here import diffusers, so the whole pack failed to register -- 0 nodes.
#
# The cap exists nowhere else: ComfyUI-TRELLIS2 takes the same 2.8.3 from the
# same farm and works, because it never installs xformers.
#
# Nothing is lost. On torch 2.x diffusers already defaults to AttnProcessor2_0
# (attention_processor.py:307), i.e. PyTorch SDPA, which dispatches to flash
# kernels; enable_xformers_memory_efficient_attention() switched *off* that
# default. The shipped TripoSG workflows already pass force_disable_xformers.
# The 34 in-pack imports are guarded and take their existing fallback.

# ML / diffusion stack. Left unpinned on purpose -- see the header note about
# the vendored pins being pip-freezes rather than real constraints.
diffusers = ">=0.26.1"
transformers = ">=4.36.2"
accelerate = "*"
safetensors = "*"
open_clip_torch = "*"
huggingface_hub = "*"
peft = "*"
mmgp = "*"

# Training / metrics helpers used by the LRM + reconstruction families.
torchmetrics = "*"
pytorch_msssim = "*"
pytorch-lightning = "*"

# Numerics & imaging.
numpy = "*"
scipy = "*"
einops = "*"
kornia = "*"
opencv-python = "*"
pillow = "*"
matplotlib = "*"
imageio = "*"
imageio-ffmpeg = "*"
rembg = "*"
onnxruntime = "*"
# realesrgan deliberately absent: it pulls basicsr 1.4.2, whose setup.py reads
# its version through exec() + locals() -- broken by PEP 667 on Python 3.13, so
# it cannot build. Its only use (Hunyuan3D 2.1 multiview upscaling) is now a
# pass-through in hy3dpaint/utils/image_super_utils.py.

# Mesh / geometry.
trimesh = "*"
plyfile = "*"
pygltflib = "*"
xatlas = "*"
pymeshlab = "*"
pymeshfix = "*"
fast-simplification = "*"
# >=0.3.5, not "*". 0.3.7 requires scipy<=1.15; an env that resolves scipy
# 1.15.3 excludes it and the resolver backtracks seven releases to 0.3.0,
# which predates NumPy 2 and raises `np.Inf was removed` on import. That is
# how a test env on py310 registered 0 nodes while this one worked: same
# numpy 2.2.6, different scipy, different gpytoolbox. 0.3.5 is the floor
# because it is the first release with cp313 wheels.
gpytoolbox = ">=0.3.5"
PyMCubes = "*"
pyvista = "*"
igraph = "*"
# open3d deliberately absent: wheel-only, cp38-cp312, no sdist -- it pins the
# whole env to <=3.12. Its one live use (MV_Adapter's UVAtlas parameterization)
# now runs on xatlas above.

# Neural rendering helpers that are NOT farm wheels.
nerfacc = ">=0.5.3"       # LGM + Instant-NGP; JIT-compiles at first use
slangtorch = "*"          # StableFast3D texture baker only

# Config / typing.
omegaconf = "*"
pyhocon = "*"
torchtyping = ">=0.1.5"
jaxtyping = "*"
easydict = "*"
iopath = "*"
packaging = "*"
tqdm = "*"
requests = "*"

# Pure-python git deps upstream pulls from HEAD. Pinned here: unpinned HEAD
# makes builds irreproducible, which is how upstream's my-reqs.txt drifted.
# PINNED. Unpinned this tracked HEAD and drifted to 1.7, which removed or
# renamed eight functions TRELLIS and Stable3DGen call --
#     AttributeError: module 'utils3d.torch' has no attribute
#     'perspective_from_fov_xy'
# and likewise intrinsics_from_fov_xy, rasterize_triangle_faces,
# compute_edges, compute_dual_graph, compute_connected_components,
# compute_edge_connected_components, remove_unreferenced_vertices.
# This is the revision TRELLIS upstream pins; all eight are present in it.
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "9a4eb15e4021b67b12c460c7057d642626897ec8" }
kiui = { git = "https://github.com/ashawkey/kiuikit.git" }

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"