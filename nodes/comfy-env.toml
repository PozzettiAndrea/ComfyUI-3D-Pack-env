[cuda]
packages = [
  "nvdiffrast",
  "pytorch3d",
  "torch_scatter",
  "torch_cluster",
  "spconv",
  "cumm",
  "flash_attn",
  "sageattention",
  "diff_gaussian_rasterization",
  "simple_knn",
  "diso",
  "pointnet2_ops",
  "vox2seq",
  "custom_rasterizer_hy3d2"
]

[dependencies]
# Conda-side: compilers for the handful of runtime-JIT extensions that remain
# (Hunyuan3D_V1's rendering_neus ops, StableFast3D's slang kernels).
c-compiler = "*"
cxx-compiler = "*"

[pypi-dependencies]
comfy-kitchen = "*"
comfy-aimdo = "*"

# xformers is NOT a farm package: upstream publishes per-torch/cu wheels itself.
# 70 files across the multi-view diffusion families import it.
xformers = "*"

# ML / diffusion stack. Left unpinned on purpose -- see the header note about
# the vendored pins being pip-freezes rather than real constraints.
diffusers = ">=0.26.1"
transformers = ">=4.36.2"
accelerate = "*"
safetensors = "*"
open_clip_torch = "*"
huggingface_hub = "*"
peft = "*"
mmgp = "*"

# Training / metrics helpers used by the LRM + reconstruction families.
torchmetrics = "*"
pytorch_msssim = "*"
pytorch-lightning = "*"

# Numerics & imaging.
numpy = "*"
scipy = "*"
einops = "*"
kornia = "*"
opencv-python = "*"
pillow = "*"
matplotlib = "*"
imageio = "*"
imageio-ffmpeg = "*"
rembg = "*"
onnxruntime = "*"
realesrgan = "*"          # Hunyuan3D 2.1 upscaling; needs the torchvision_fix shim

# Mesh / geometry.
trimesh = "*"
plyfile = "*"
pygltflib = "*"
xatlas = "*"
pymeshlab = "*"
pymeshfix = "*"
fast-simplification = "*"
gpytoolbox = "*"
PyMCubes = "*"
libigl = "*"
pyvista = "*"
igraph = "*"
open3d = "*"

# Neural rendering helpers that are NOT farm wheels.
nerfacc = ">=0.5.3"       # LGM + Instant-NGP; JIT-compiles at first use
slangtorch = "*"          # StableFast3D texture baker only

# Config / typing.
omegaconf = "*"
pyhocon = "*"
torchtyping = ">=0.1.5"
jaxtyping = "*"
easydict = "*"
iopath = "*"
packaging = "*"
tqdm = "*"
requests = "*"

# Pure-python git deps upstream pulls from HEAD. Pinned here: unpinned HEAD
# makes builds irreproducible, which is how upstream's my-reqs.txt drifted.
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git" }
kiui = { git = "https://github.com/ashawkey/kiuikit.git" }

[env_vars]
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"