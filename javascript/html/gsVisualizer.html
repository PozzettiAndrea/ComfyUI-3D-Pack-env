<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style/gsStyle.css">
  <!-- coloris.min.css was never shipped; the file is coloris.css, which is
       what threeVisualizer.html already loads. Pre-existing 404. -->
  <link type="text/css" rel="stylesheet" href="../style/coloris.css">
  <link type="text/css" rel="stylesheet" href="../style/sharedStyle.css">
</head>
<body>
  <div id="progress-container">
    <dialog open id="progress-dialog">
        <p>
            <label for="progress-indicator">Loading scene...</label>
        </p>
        <progress max="100" id="progress-indicator"></progress>
    </dialog>
  </div>

  <div id="container">
    <canvas id="canvas"></canvas>
		<!-- Vendored, and patched: upstream gsplat fetches with
		     credentials:"omit", which drops the session cookie behind an
		     authenticating proxy and makes every splat load fail. See the header
		     of gsplat-bundle.mjs. -->
		<script type="importmap">
			{
			  "imports": {
				"gsplat": "../js/gsplat-bundle.mjs"
			  }
			}
		</script>
    <script id="visualizer" type="module" filepath="" timestamp="" crossorigin src="../js/gsVisualizer.mjs"></script>
  </div>

  <script src="../js/coloris.mjs"></script>
  <script>
    Coloris({
      el: '.coloris',
      theme: 'polaroid',
      themeMode: 'dark',
      format: 'rgb',
      alpha: false,
      swatches: [
        'rgb(0, 0, 0)',
        'rgb(128, 128, 128)',
        'rgb(255, 255, 255)',
        'rgb(132, 188, 218)',
        'rgb(128, 227, 119)',
        'rgb(213, 96, 98)'
      ]
    });

    const canvas = document.getElementById("canvas");
    const handleClick = () => {
      Coloris.close();
      document.activeElement.blur();
    };
    canvas.addEventListener('click', handleClick);
    
  </script>
  <input type="text" id="color-picker" class="coloris" value="rgb(128, 128, 128)"></input>
</body>
</html>
