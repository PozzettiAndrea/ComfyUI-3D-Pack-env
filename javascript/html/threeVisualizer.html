<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="../style/threeStyle.css">
		<link type="text/css" rel="stylesheet" href="../style/coloris.css">
		<link type="text/css" rel="stylesheet" href="../style/sharedStyle.css">
	</head>

	<body>
		<div id="progress-container">
			<dialog open id="progress-dialog">
				<p>
					<label for="progress-indicator">Loading scene...</label>
				</p>
				<progress max="100" id="progress-indicator"></progress>
			</dialog>
		</div>

		<div id="container">
			<!-- Vendored under ../vendor/, not a CDN: the viewer must work offline and
			     must not fetch third-party code into a page showing local output.
			     "three@latest" also meant any upstream release could break this
			     viewer without a commit here. Pinned copy is three 0.185.1. -->
			<script type="importmap">
				{
				  "imports": {
					"three": "../vendor/three/three.module.mjs",
					"three/addons/loaders/GLTFLoader.js": "../vendor/three/addons/loaders/GLTFLoader.mjs",
					"three/addons/loaders/OBJLoader.js": "../vendor/three/addons/loaders/OBJLoader.mjs",
					"three/addons/loaders/MTLLoader.js": "../vendor/three/addons/loaders/MTLLoader.mjs",
					"three/addons/loaders/DRACOLoader.js": "../vendor/three/addons/loaders/DRACOLoader.mjs",
					"three/addons/controls/OrbitControls.js": "../vendor/three/addons/controls/OrbitControls.mjs",
					"three/addons/environments/RoomEnvironment.js": "../vendor/three/addons/environments/RoomEnvironment.mjs"
				  }
				}
			</script>
			<script id="visualizer" type="module" filepath="" timestamp="" crossorigin src="../js/threeVisualizer.mjs"></script>
		</div>

		<script src="../js/coloris.mjs"></script>
		<script>
			Coloris({
				el: '.coloris',
				theme: 'polaroid',
				themeMode: 'dark',
				format: 'rgb',
				alpha: false,
				swatches: [
					'rgb(0, 0, 0)',
					'rgb(128, 128, 128)',
					'rgb(255, 255, 255)',
					'rgb(132, 188, 218)',
					'rgb(128, 227, 119)',
					'rgb(213, 96, 98)'
				]
			});
		</script>
		<button type="button" id="download-button">Download</button>
		<input type="text" id="color-picker" class="coloris" value="rgb(128, 128, 128)"></input>
	</body>

</html>
